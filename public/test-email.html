<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>اختبار EmailJS</title>
<style>
body{font-family:Arial;max-width:500px;margin:50px auto;padding:20px;background:#0f172a;color:#fff;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;font-size:16px}
button{width:100%;padding:15px;background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:8px;font-size:18px;cursor:pointer}
button:hover{opacity:0.9}
#status{margin-top:20px;padding:15px;border-radius:8px;font-size:16px}
.success{background:rgba(34,197,94,0.2);color:#4ade80}
.error{background:rgba(239,68,68,0.2);color:#f87171}
</style>
</head>
<body>
<h1>🧪 اختبار EmailJS</h1>
<p>اكتب إيميلك وجرب إرسال رمز تجريبي</p>

<input type="text" id="name" placeholder="اسمك" value="Omar">
<input type="email" id="email" placeholder="إيميلك" value="omarqwader84@gmail.com">
<input type="text" id="code" placeholder="الرمز" value="784529">

<button onclick="sendTest()">📧 إرسال إيميل تجريبي</button>

<div id="status"></div>

<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
emailjs.init("Txua0qMHTDOq-zxQC");

function sendTest() {
  const btn = document.querySelector("button");
  const status = document.getElementById("status");
  
  btn.disabled = true;
  btn.innerText = "⏳ جاري الإرسال...";
  status.className = "";
  status.innerText = "";
  
  emailjs.send("service_fxtytzf", "template_gryegki", {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    code: document.getElementById("code").value
  }).then(() => {
    status.className = "success";
    status.innerText = "✅ تم إرسال الإيميل بنجاح! شيك إيميلك.";
    btn.innerText = "📧 إرسال إيميل تجريبي";
    btn.disabled = false;
  }).catch(err => {
    status.className = "error";
    status.innerText = "❌ خطأ: " + err.text;
    btn.innerText = "📧 إرسال إيميل تجريبي";
    btn.disabled = false;
    console.error(err);
  });
}
</script>
</body>
</html>
