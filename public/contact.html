<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا - قويدر ستور</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%); border-radius: 24px; border: 1px solid rgba(148,163,184,0.1); box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 40px rgba(99,102,241,0.15); max-width: 500px; width: 100%; overflow: hidden; }
.header { background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); height: 5px; }
.content { padding: 40px 30px; text-align: center; }
.logo { width: 70px; height: 70px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
h1 { color: #f8fafc; font-size: 26px; margin-bottom: 8px; }
p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
input, textarea { width: 100%; padding: 14px 16px; margin-bottom: 14px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 15px; font-family: inherit; transition: all 0.3s; }
input:focus, textarea:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
input::placeholder, textarea::placeholder { color: #64748b; }
button { width: 100%; padding: 16px; background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 8px 25px rgba(99,102,241,0.3); }
button:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(99,102,241,0.4); }
.success { display: none; padding: 40px 30px; text-align: center; }
.success h2 { color: #4ade80; font-size: 28px; margin-bottom: 10px; }
.success p { color: #94a3b8; font-size: 15px; }
.footer { padding: 20px; text-align: center; background: rgba(15,23,42,0.5); }
.footer p { color: #475569; font-size: 12px; }
</style>
</head>
<body>

<div class="card">
  <div class="header"></div>
  
  <div class="content" id="formSection">
    <div class="logo">🎮</div>
    <h1>تواصل معنا</h1>
    <p class="subtitle">ارسل لنا رسالتك وسنرد عليك في أقرب وقت</p>
    
    <form action="https://formspree.io/f/xbgjgjyq" method="POST" onsubmit="showSuccess(event)">
      <input type="text" name="name" placeholder="اسمك الكامل" required>
      <input type="email" name="email" placeholder="بريدك الإلكتروني" required>
      <input type="text" name="subject" placeholder="الموضوع" required>
      <textarea name="message" placeholder="رسالتك..." rows="5" required></textarea>
      <button type="submit">🚀 إرسال الرسالة</button>
    </form>
  </div>
  
  <div class="success" id="successSection">
    <div class="logo">✅</div>
    <h2>تم الإرسال!</h2>
    <p>شكراً لتواصلك معنا. سنرد عليك في أقرب وقت ممكن.</p>
    <br>
    <button onclick="window.location.reload()" style="width: auto; padding: 12px 30px;">إرسال رسالة جديدة</button>
  </div>
  
  <div class="footer">
    <p>© 2026 قويدر ستور | الأردن 🇯🇴</p>
  </div>
</div>

<script>
function showSuccess(e) {
  e.preventDefault();
  const form = e.target;
  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { Accept: 'application/json' }
  }).then(response => {
    if (response.ok) {
      document.getElementById('formSection').style.display = 'none';
      document.getElementById('successSection').style.display = 'block';
    }
  });
}
</script>

</body>
</html>
